[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laneige-engine"
version = "0.1.0"
description = "Agentic demand forecasting & supply planning engine (India festival-aware)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "plotly>=5.20",
    "streamlit>=1.46",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["laneige_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
